<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByeBye2025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            margin: 0;
            overflow: hidden;
        }

        .countdown-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2em;
            color: #333;
        }

        #countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            margin: 10px;
        }

        .time-box span {
            display: block;
            font-size: 2.5em;
            color: #333;
        }

        .label {
            font-size: 0.8em;
            color: #777;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #777;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            background: transparent;
            border-radius: 50%;
            box-shadow: 0 0 10px 4px rgba(255, 0, 0, 1);
            animation: firework 1.5s ease-out infinite;
        }

            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-200px) scale(4);
                opacity: 0;
            }
        }
