<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c2461, #1e3799, #4a69bd);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(90deg, #ff9ff3, #feca57);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #dff9fb;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin: 50px 0;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px 20px;
            min-width: 150px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .countdown-box:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
        }

        .countdown-value {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(90deg, #48dbfb, #0abde3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .countdown-label {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #c8d6e5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .target-date {
            font-size: 1.8rem;
            margin: 30px 0;
            color: #feca57;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-sound {
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn-sound:hover {
            background: linear-gradient(90deg, #ee5a24, #ff6b6b);
            transform: scale(1.05);
        }

        .btn-test {
            background: linear-gradient(90deg, #1dd1a1, #10ac84);
            color: white;
        }

        .btn-test:hover {
            background: linear-gradient(90deg, #10ac84, #1dd1a1);
            transform: scale(1.05);
        }

        .btn-reset {
            background: linear-gradient(90deg, #54a0ff, #2e86de);
            color: white;
        }

        .btn-reset:hover {
            background: linear-gradient(90deg, #2e86de, #54a0ff);
            transform: scale(1.05);
        }

        .sound-control {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        .sound-toggle {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .sound-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1dd1a1;
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        .message {
            margin-top: 40px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 1.5rem;
            display: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .celebration {
            font-size: 5rem;
            margin: 20px;
            display: none;
        }

        .footer {
            margin-top: 50px;
            color: #c8d6e5;
            font-size: 1rem;
            text-align: center;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .countdown-box {
                min-width: 120px;
                padding: 20px 15px;
            }
            
            .countdown-value {
                font-size: 3.5rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 80%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .countdown-container {
                gap: 15px;
            }
            
            .countdown-box {
                min-width: 100px;
                padding: 15px 10px;
            }
            
            .countdown-value {
                font-size: 2.8rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-clock"></i> Countdown to 2026</h1>
        <p class="subtitle">The new year begins in:</p>
        
        <div class="countdown-container">
            <div class="countdown-box">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>
        
        <div class="target-date" id="target-date">Target: January 1, 2026 00:00:00</div>
        
        <div class="controls">
            <button class="btn btn-sound" id="toggle-sound">
                <i class="fas fa-volume-up"></i> Sound: ON
            </button>
            <button class="btn btn-test" id="test-sound">
                <i class="fas fa-music"></i> Test Sound
            </button>
            <button class="btn btn-reset" id="reset-countdown">
                <i class="fas fa-redo"></i> Reset Countdown
            </button>
        </div>
        
        <div class="sound-control">
            <span>Enable Celebration Sound:</span>
            <label class="sound-toggle">
                <input type="checkbox" id="sound-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="message" id="message">
            <i class="fas fa-fireworks"></i> Happy New Year 2026! <i class="fas fa-fireworks"></i>
        </div>
        
        <div class="celebration" id="celebration">
            🎉🎊🥳
        </div>
    </div>
    
    <div class="footer">
        <p>Countdown Timer with Sound Notification | Created with HTML, CSS & JavaScript</p>
        <p id="current-time"></p>
    </div>

    <!-- Hidden audio elements -->
    <audio id="countdown-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="celebration-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-party-horn-sound-2927.mp3" type="audio/mpeg">
    </audio>

    <script>
        // DOM elements
        const daysElement = document.getElementById('days');
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');
        const targetDateElement = document.getElementById('target-date');
        const messageElement = document.getElementById('message');
        const celebrationElement = document.getElementById('celebration');
        const currentTimeElement = document.getElementById('current-time');
        const toggleSoundBtn = document.getElementById('toggle-sound');
        const testSoundBtn = document.getElementById('test-sound');
        const resetBtn = document.getElementById('reset-countdown');
        const soundToggle = document.getElementById('sound-toggle');
        
        // Audio elements
        const countdownSound = document.getElementById('countdown-sound');
        const celebrationSound = document.getElementById('celebration-sound');
        
        // Set the target date to January 1, 2026
        const targetDate = new Date('January 1, 2026 00:00:00').getTime();
        targetDateElement.textContent = `Target: ${new Date(targetDate).toLocaleString()}`;
        
        // Sound state
        let soundEnabled = true;
        let countdownFinished = false;
        
        // Update current time display
        function updateCurrentTime() {
            const now = new Date();
            currentTimeElement.textContent = `Current Time: ${now.toLocaleString()}`;
        }
        
        // Update countdown
        function updateCountdown() {
            const now = new Date().getTime();
            const timeRemaining = targetDate - now;
            
            // If countdown is finished
            if (timeRemaining <= 0) {
                // Stop the countdown
                clearInterval(countdownInterval);
                
                // Show celebration
                daysElement.textContent = '00';
                hoursElement.textContent = '00';
                minutesElement.textContent = '00';
                secondsElement.textContent = '00';
                
                // Show celebration message
                messageElement.style.display = 'block';
                celebrationElement.style.display = 'block';
                
                // Play celebration sound if enabled and not already played
                if (soundEnabled && soundToggle.checked && !countdownFinished) {
                    celebrationSound.play();
                    countdownFinished = true;
                }
                
                return;
            }
            
            // Calculate days, hours, minutes, seconds
            const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);
            
            // Update display
            daysElement.textContent = days.toString().padStart(2, '0');
            hoursElement.textContent = hours.toString().padStart(2, '0');
            minutesElement.textContent = minutes.toString().padStart(2, '0');
            secondsElement.textContent = seconds.toString().padStart(2, '0');
            
            // Play countdown sound on the last 10 seconds if enabled
            if (soundEnabled && timeRemaining < 10000 && timeRemaining > 0) {
                // Play sound at each second in the last 10 seconds
                if (seconds <= 10) {
                    countdownSound.currentTime = 0;
                    countdownSound.play();
                }
            }
        }
        
        // Toggle sound
        toggleSoundBtn.addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                toggleSoundBtn.innerHTML = '<i class="fas fa-volume-up"></i> Sound: ON';
                toggleSoundBtn.classList.remove('btn-sound');
                toggleSoundBtn.classList.add('btn-sound');
            } else {
                toggleSoundBtn.innerHTML = '<i class="fas fa-volume-mute"></i> Sound: OFF';
                toggleSoundBtn.classList.remove('btn-sound');
                toggleSoundBtn.classList.add('btn-test');
            }
        });
        
        // Test sound
        testSoundBtn.addEventListener('click', function() {
            if (soundEnabled) {
                celebrationSound.currentTime = 0;
                celebrationSound.play();
                
                // Visual feedback
                testSoundBtn.innerHTML = '<i class="fas fa-check"></i> Sound Tested!';
                setTimeout(() => {
                    testSoundBtn.innerHTML = '<i class="fas fa-music"></i> Test Sound';
                }, 1500);
            }
        });
        
        // Reset countdown (for demonstration purposes, resets to 10 seconds from now)
        resetBtn.addEventListener('click', function() {
            // Reset to 10 seconds from now for demo
            const resetTime = new Date().getTime() + 10000;
            const resetDate = new Date(resetTime);
            
            // Update target date display
            targetDateElement.textContent = `Target: ${resetDate.toLocaleString()} (Demo Mode)`;
            
            // Hide celebration elements
            messageElement.style.display = 'none';
            celebrationElement.style.display = 'none';
            
            // Reset countdown finished flag
            countdownFinished = false;
            
            // Update countdown function to use new target
            const originalUpdateCountdown = updateCountdown;
            
            // Create new countdown function with reset target
            function updateResetCountdown() {
                const now = new Date().getTime();
                const timeRemaining = resetTime - now;
                
                // If countdown is finished
                if (timeRemaining <= 0) {
                    // Stop the countdown
                    clearInterval(countdownInterval);
                    
                    // Show celebration
                    daysElement.textContent = '00';
                    hoursElement.textContent = '00';
                    minutesElement.textContent = '00';
                    secondsElement.textContent = '00';
                    
                    // Show celebration message
                    messageElement.style.display = 'block';
                    celebrationElement.style.display = 'block';
                    
                    // Play celebration sound if enabled and not already played
                    if (soundEnabled && soundToggle.checked && !countdownFinished) {
                        celebrationSound.play();
                        countdownFinished = true;
                    }
                    
                    return;
                }
                
                // Calculate days, hours, minutes, seconds
                const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);
                
                // Update display
                daysElement.textContent = days.toString().padStart(2, '0');
                hoursElement.textContent = hours.toString().padStart(2, '0');
                minutesElement.textContent = minutes.toString().padStart(2, '0');
                secondsElement.textContent = seconds.toString().padStart(2, '0');
                
                // Play countdown sound on the last 10 seconds if enabled
                if (soundEnabled && timeRemaining < 10000 && timeRemaining > 0) {
                    // Play sound at each second in the last 10 seconds
                    if (seconds <= 10) {
                        countdownSound.currentTime = 0;
                        countdownSound.play();
                    }
                }
            }
            
            // Clear the existing interval and start new one
            clearInterval(countdownInterval);
            countdownInterval = setInterval(updateResetCountdown, 1000);
            
            // Visual feedback
            resetBtn.innerHTML = '<i class="fas fa-check"></i> Reset!';
            setTimeout(() => {
                resetBtn.innerHTML = '<i class="fas fa-redo"></i> Reset Countdown';
            }, 1500);
        });
        
        // Initialize
        updateCountdown();
        updateCurrentTime();
        
        // Update countdown every second
        let countdownInterval = setInterval(updateCountdown, 1000);
        
        // Update current time every second
        setInterval(updateCurrentTime, 1000);
        
        // Add some visual effects to countdown boxes
        const countdownBoxes = document.querySelectorAll('.countdown-box');
        countdownBoxes.forEach(box => {
            box.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-10px) scale(1.05)';
            });
            
            box.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
